<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-66Dy1MAoaF++9qUYVOf8gF/RRcCSto3BzmGzcIY7GCg='; style-src 'sha256-T+cNcdryRPe66BUwJwpPzPXu7Ca9jwitFasq/AAvR60='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>かいものメモ：パスワードつきの バックアップを 開く</title>
<style>
body{margin:0;background:#f7fbf1;color:#191d17;font:400 18px/1.7 system-ui,-apple-system,"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;line-height:1.4;margin:.5rem 0 1rem}
h2{font-size:1.1rem;margin:1.5rem 0 .5rem}
label{display:block;margin:1.2rem 0 .3rem;font-weight:600}
input{font:inherit;width:100%;box-sizing:border-box;padding:.6rem .8rem;border:1px solid #72796f;border-radius:8px;background:#fff}
button,.save{display:inline-block;margin-top:1.2rem;padding:.75rem 1.5rem;border:0;border-radius:999px;background:#3b693a;color:#fff;font:inherit;font-weight:600;line-height:1.3;text-decoration:none;cursor:pointer}
.note{color:#424940;font-size:.95rem}
#msg{min-height:1.7em;margin-top:1rem;font-weight:600}
ul{padding-left:1.3rem}
.warn{color:#ba1a1a}
</style>
</head>
<body>
<main>
<h1>パスワードつきの バックアップを 開く</h1>
<p class="note">かいものメモで パスワードを かけた バックアップを、アプリが なくても 開ける ページです。この ページを 保存して おけば、インターネットに つながって いなくても 使えます。ファイルは この スマホ・パソコンの 中だけで 開き、どこにも 送りません。</p>
<label for="file">バックアップの ファイル</label>
<input id="file" type="file" accept=".txt,.json,text/plain,application/json">
<label for="pass">パスワード</label>
<input id="pass" type="password" autocomplete="off">
<p id="hint" class="note"></p>
<button id="go" type="button">開く</button>
<p id="msg" role="status"></p>
<section id="out" hidden>
<h2>中身</h2>
<p id="about"></p>
<ul id="list"></ul>
<a id="save" class="save" href="#">パスワードを はずした ファイルを 保存</a>
<p class="note warn">保存した ファイルには パスワードが かかって いません。アプリで 読みこんだら、けして おいて ください。</p>
</section>
</main>
<script>
(() => {
'use strict';
// the format: { app: 'kaimono', version: 1, locked: { cipher: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter, salt, iv, hint? }, data }
// data is the backup's JSON text encrypted with AES-GCM (256-bit key from PBKDF2-SHA256 over the password); all base64
const $ = s => document.querySelector(s);
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const say = t => { $('#msg').textContent = t; };
async function unlock(locked, data, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(locked.salt), iterations: +locked.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(locked.iv) }, key, unb64(data)));
}
let url = '';
// a hint written when the backup was made (never the password itself) shows as soon as the file is chosen
$('#file').addEventListener('change', async () => {
  $('#hint').textContent = '';
  const f = $('#file').files[0];
  if (!f) return;
  try { const d = JSON.parse(await f.text()); if (d && d.locked && d.locked.hint) $('#hint').textContent = 'ヒント：' + String(d.locked.hint).slice(0, 40); } catch (e) {}
});
$('#go').addEventListener('click', async () => {
  const f = $('#file').files[0];
  $('#out').hidden = true;
  if (!f) { say('ファイルを えらんで ください。'); return; }
  let d;
  try { d = JSON.parse(await f.text()); } catch (e) { say('この ファイルは 読めません。'); return; }
  if (!d || d.app !== 'kaimono') { say('かいものメモの ファイルでは ないようです。'); return; }
  let text = JSON.stringify(d), plain = d;
  if (d.locked) {
    if (!$('#pass').value) { say('パスワードを 入れて ください。'); return; }
    say('開いて います…');
    try { text = await unlock(d.locked, d.data, $('#pass').value); plain = JSON.parse(text); }
    catch (e) { say('パスワードが ちがう ようです。' + (d.locked.hint ? 'ヒント：' + String(d.locked.hint).slice(0, 40) : '')); return; }
  }
  const items = Array.isArray(plain.items) ? plain.items : [];
  const at = Date.parse(plain.exportedAt);
  $('#about').textContent = (at ? `${new Date(at).toLocaleString('ja-JP')}に 作った バックアップ` : 'バックアップ')
    + `${plain.appVersion ? `（${plain.appVersion}）` : ''}：品物 ${items.length}こ・写真 ${Object.keys(plain.photos || {}).length}まい`
    + (Array.isArray(plain.history) ? `・送った記録 ${plain.history.length}回分` : '');
  const list = $('#list');
  list.textContent = '';
  for (const it of items) { const li = document.createElement('li'); li.textContent = String(it && it.name || ''); list.appendChild(li); }
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  $('#save').href = url;
  $('#save').download = 'kaimono-backup-open.json';
  $('#out').hidden = false;
  say(d.locked ? '開けました。' : 'この ファイルには パスワードが かかって いません。そのまま アプリで 読みこめます。');
});
})();
</script>
</body>
</html>
